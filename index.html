<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Celebrate with Emily and James. Check your invitation and RSVP.">
    <meta name="theme-color" content="#dcecf6">
    <title>Emily &amp; James</title>
    <link rel="stylesheet" href="styles.css">
    <script src="guest-lookup.js" defer></script>
  </head>
  <body>
    <main>
      <div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="eyebrow">We're getting married</p>
      <h1>Emily <span>&amp;</span> James</h1>
      <div class="divider" aria-hidden="true"></div>
      <!-- wedding-content:start -->
      <p class="message">Our next chapter is on its way.</p>
      <!-- wedding-content:end -->
      <section class="invitation" aria-labelledby="invitation-title">
        <h2 id="invitation-title">A celebration with our favorite people</h2>
        <button class="primary-button rsvp-button" id="open-lookup" type="button" aria-expanded="false" aria-controls="lookup-panel" hidden>RSVP</button>
        <div id="lookup-panel" aria-hidden="true" inert hidden>
          <div class="lookup-content">
            <div class="lookup-inner">
          <p class="details" id="lookup-help">Enter your first and last name as they appear on your invitation.</p>
          <form id="guest-lookup" aria-describedby="lookup-help">
            <div class="name-fields">
              <label>First name<input name="first_name" autocomplete="given-name" maxlength="100" required></label>
              <label>Last name<input name="last_name" autocomplete="family-name" maxlength="100" required></label>
            </div>
            <button class="primary-button" type="submit">Check my invitation</button>
          </form>
          <p id="lookup-status" class="details lookup-status" role="status" aria-live="polite"></p>
          <p class="lookup-note">We only check your name against our invitation list -- we don't save anything you enter here.</p>
            </div>
          </div>
        </div>
        <noscript><p class="details">Please enable JavaScript to check your invitation.</p></noscript>
      </section>
      <p class="signoff">With love, Emily &amp; James</p>
    </main>
  </body>
</html>
